[package]
name = "chunkedrs"
version = "3.0.0"
edition = "2024"
description = "Split text into chunks that fit a token budget, for embedding and retrieval: recursive, markdown, code, HTML and semantic strategies, exact byte ranges and document token spans"
license = "MIT OR Apache-2.0"
repository = "https://github.com/goliajp/rust-chunker"
authors = ["GOLIA K.K.", "DoraCawl <doracawl@golia.jp>"]
documentation = "https://docs.rs/chunkedrs"
keywords = ["chunking", "rag", "text-splitter", "tiktoken", "embeddings"]
categories = ["text-processing", "algorithms"]
readme = "README.md"

[dependencies]
# 5.6 is the first release with `CoreBpe::next_cut` / `prev_cut`, which let a
# chunk be counted from the document's own ids plus two short encodes; 5.7
# the first with `encode_with_ends_into`, which gives each token's end offset
# from the encode itself.
#
# `vocab-o200k_base` is not optional here: it is the encoding `Chunker::new`
# uses. Everything beyond it is the caller's choice.
tiktoken = { version = "5.7", default-features = false, features = [
    "vocab-o200k_base",
] }
# Only for `Chunker::split_semantic`, which takes any `embedrs::Embed`. With
# its default features off embedrs has no dependencies; the caller's own
# embedrs features (transport, local models) unify with this one.
embedrs = { version = "0.7", default-features = false, optional = true }

[features]
# Vocabularies are opt-out, mirroring tiktoken. The default is every one of
# them, which is what a 1.x build shipped; `default-features = false` keeps
# ~5 MB of vocabulary data you may not need out of your binary, leaving
# o200k_base (GPT-4o / GPT-5 / o-series), the encoding `Chunker::new` uses.
#
#   chunkedrs = { version = "3", default-features = false }
#   chunkedrs = { version = "3", default-features = false, features = ["vocab-zhipu"] }
default = ["vocabs-all"]
semantic = ["dep:embedrs"]

vocabs-all = ["tiktoken/vocabs-all"]

# by vendor
vocab-openai = ["tiktoken/vocab-openai"]
vocab-meta = ["tiktoken/vocab-meta"]
vocab-deepseek = ["tiktoken/vocab-deepseek"]
vocab-qwen = ["tiktoken/vocab-qwen"]
vocab-mistral = ["tiktoken/vocab-mistral"]
vocab-moonshot = ["tiktoken/vocab-moonshot"]
vocab-zhipu = ["tiktoken/vocab-zhipu"]
vocab-minimax = ["tiktoken/vocab-minimax"]

# by vocabulary
vocab-cl100k_base = ["tiktoken/vocab-cl100k_base"]
vocab-o200k_base = ["tiktoken/vocab-o200k_base"]
vocab-r50k_base = ["tiktoken/vocab-r50k_base"]
vocab-p50k_base = ["tiktoken/vocab-p50k_base"]
vocab-llama3 = ["tiktoken/vocab-llama3"]
vocab-llama4 = ["tiktoken/vocab-llama4"]
vocab-deepseek_v3 = ["tiktoken/vocab-deepseek_v3"]
vocab-qwen2 = ["tiktoken/vocab-qwen2"]
vocab-qwen3_5 = ["tiktoken/vocab-qwen3_5"]
vocab-mistral_v3 = ["tiktoken/vocab-mistral_v3"]
vocab-mistral_v15 = ["tiktoken/vocab-mistral_v15"]
vocab-kimi_k2 = ["tiktoken/vocab-kimi_k2"]
vocab-glm4 = ["tiktoken/vocab-glm4"]
vocab-glm5 = ["tiktoken/vocab-glm5"]
vocab-minimax_m2 = ["tiktoken/vocab-minimax_m2"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# the semantic tests run a real model on the CPU, no API key
embedrs = { version = "0.7", features = ["local"] }

[workspace]
members = [".", "bench-compare"]

[profile.release]
lto = true
codegen-units = 1
