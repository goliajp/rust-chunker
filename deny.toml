[graph]
all-features = true

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
]
confidence-threshold = 0.93

[advisories]
version = 2
yanked = "deny"
# 'unmaintained' flags transitive crates we cannot remove; gate only on our
# own workspace members.
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"
