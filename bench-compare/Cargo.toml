# Comparison harness: chunkedrs vs text-splitter on identical corpora and the
# same timing discipline (warmup, then the median of 9 rounds). Never
# published; text-splitter and tiktoken-rs stay out of the shipped crate.
#
# Corpora in data/:
#   book_en.txt       Pride and Prejudice, chapters 2 onwards (public domain)
#   zh_xiyouji.md     Journey to the West, chapters 1-9, from Wikisource (public domain)
#   ja_neko.txt       I Am a Cat (Natsume Soseki), the first 180,000 bytes, from
#                     Aozora Bunko with ruby and annotations removed (public domain)
#   md_rust_book.md   The Rust Programming Language, chapters 3-6 (MIT OR Apache-2.0)
#   code_rust.txt     Rust source of the tiktoken crate (MIT OR Apache-2.0)
[package]
name = "bench-compare"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
chunkedrs = { path = "..", default-features = false, features = ["vocab-cl100k_base", "vocab-qwen3_5", "vocab-llama3", "vocab-glm5"] }
# the previous releases, for the timing table; 3.1.0 from its tag, since
# cargo takes one 3.x release of a crate from crates.io
chunkedrs31 = { package = "chunkedrs", git = "https://github.com/goliajp/rust-chunker", tag = "v3.1.0", default-features = false, features = ["vocab-cl100k_base", "vocab-qwen3_5", "vocab-llama3", "vocab-glm5"] }
chunkedrs30 = { package = "chunkedrs", version = "=3.0.0", default-features = false, features = ["vocab-cl100k_base", "vocab-qwen3_5", "vocab-llama3", "vocab-glm5"] }
# the release before 3.0, for the timing table and the differential test
chunkedrs22 = { package = "chunkedrs", version = "=2.2.0", default-features = false, features = ["vocab-cl100k_base", "vocab-qwen3_5", "vocab-llama3", "vocab-glm5"] }
tiktoken = { version = "5.7", default-features = false, features = ["vocab-o200k_base", "vocab-cl100k_base"] }
tiktoken-rs = "=0.12.1"
text-splitter = { version = "=0.33.6", features = ["tiktoken-rs", "markdown", "code"] }
tree-sitter-rust = "0.24"
