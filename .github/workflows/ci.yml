name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc
      # keeps the comparison harness building and running; no timing
      - run: cargo run -p bench-compare -- book
        env:
          QUICK: "1"
          ENCS: o200k_base

  feature-matrix:
    name: vocabulary feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # A slim build drops encodings at run time, not at build time:
      # Chunker::for_encoding returns an error for one that is not compiled
      # in. Only tests see that, so run them.
      - name: o200k_base only
        run: cargo test --no-default-features
      - name: one vendor group on top of the floor
        run: cargo test --no-default-features --features vocab-zhipu
      - name: one vocabulary on top of the floor
        run: cargo test --no-default-features --features vocab-cl100k_base
      - name: a vocabulary added in tiktoken 5
        run: cargo test --no-default-features --features vocab-qwen3_5
      # the semantic tests run all-MiniLM-L6-v2 (91 MB) on the CPU
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2
      - name: everything, including semantic
        run: cargo test --all-features

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  audit:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
