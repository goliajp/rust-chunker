name: ci

on:
  push:
    branches: [master, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  feature-matrix:
    name: vocabulary feature combinations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The slim build is the one that rots silently: an encoding whose
      # vocabulary is not compiled in does not fail to build, it falls back to
      # o200k_base at run time. Only tests catch that, so run them.
      - name: o200k_base only
        run: cargo test --no-default-features
      - name: one vendor group on top of the floor
        run: cargo test --no-default-features --features vocab-zhipu
      - name: one vocabulary on top of the floor
        run: cargo test --no-default-features --features vocab-cl100k_base
      - name: everything, including semantic
        run: cargo test --all-features

  lint:
    name: fmt + clippy (lib strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Library code is strict. Tests/examples/benches surface pre-existing
      # cosmetic patterns (needless_borrows_for_generic_args, clone_on_copy,
      # criterion::black_box deprecation, …) from the airs/guirs mono; we
      # surface them as advisory only, not bundled into migration releases.
      - run: cargo clippy --workspace --lib -- -D warnings
      - run: cargo clippy --workspace --all-targets

  audit:
    name: audit + deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      - run: cargo audit
      - run: cargo deny check
